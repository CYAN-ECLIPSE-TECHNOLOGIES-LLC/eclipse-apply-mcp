[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eclipse-apply"
version = "0.1.0"
description = "The auto-apply tool that shows its work — policy-scoped autonomy, review-first, receipts for everything, and a resume it can prove it never embellished."
readme = "PYPI_README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Cyan Eclipse Technologies LLC" },
]
keywords = ["mcp", "model-context-protocol", "job-search", "auto-apply", "policy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://cetech.ai"
Repository = "https://github.com/CYAN-ECLIPSE-TECHNOLOGIES-LLC/eclipse-apply-mcp"
Vendor = "https://cetech.ai"

[project.scripts]
eclipse-apply = "server:main"

# Version lockstep: this version, the VERSION file, server.json, and the
# server.py docstring all read 0.1.0 — bump them together.
# Flat layout: the runtime is the top-level server.py module. Runtime
# data read beside server.py (Path(__file__).parent / ...) is
# force-included at the same relative path in the wheel.
[tool.hatch.build.targets.wheel.force-include]
"server.py" = "server.py"
"discovery.py" = "discovery.py"
"bazaar-manifest.json" = "bazaar-manifest.json"

[tool.hatch.build.targets.sdist.force-include]
"server.py" = "server.py"
"discovery.py" = "discovery.py"
"bazaar-manifest.json" = "bazaar-manifest.json"
